<h1>Tasks</h1>
<p>
    This list is anonymous and lives in process memory. A restart restores the
    seed data.
</p>
<form
    id="task-filter"
    method="get"
    action="/tasks"
    data-graft
    role="search"
    aria-label="Filter tasks"
>
    {% include "task-filter.html" %}
</form>
<h2>Create a task</h2>
<form id="task-create" method="post" action="/tasks" data-graft>
    {% include "task-create.html" %}
</form>
<section id="task-results">{% include "task-results.html" %}</section>
