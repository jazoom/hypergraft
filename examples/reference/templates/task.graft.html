<article>
    <div id="task-detail">
        {% block task_detail %}
        <h1>{{ self.task.title }}</h1>
        <p>
            Status:
            {% if self.task.done %}
            Done
            {% else %}
            Open
            {% endif %}
        </p>
        <div id="task-detail-feedback">
            {% if let Some(message) = self.error %}
            <p role="alert">{{ message }}</p>
            {% endif %}
        </div>
        {% if self.task.done %}
        <form
            method="post"
            action="/tasks/{{ self.task.id }}/status"
            data-graft
            aria-describedby="task-detail-feedback"
        >
            <input type="hidden" name="action" value="reopen" />
            <input type="hidden" name="revision" value="{{ self.task.revision }}" />
            <p>
                <button type="submit">Reopen</button>
            </p>
        </form>
        {% else %}
        <form
            method="post"
            action="/tasks/{{ self.task.id }}/status"
            data-graft
            aria-describedby="task-detail-feedback"
        >
            <input type="hidden" name="action" value="complete" />
            <input type="hidden" name="revision" value="{{ self.task.revision }}" />
            <p>
                <button type="submit">Complete</button>
            </p>
        </form>
        {% endif %}
        {% endblock %}
    </div>
    <p><a href="/tasks" data-graft>Back to tasks</a></p>
</article>
