{% if tasks.is_empty() %}
<p>No tasks match this filter.</p>
{% else %}
<ul>
    {% for task in tasks %}
    <li>
        <a href="/tasks/{{ task.id }}" data-graft>{{ task.title }}</a>
        {% if task.done %}
        <span>Done</span>
        {% else %}
        <span>Open</span>
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% endif %}
