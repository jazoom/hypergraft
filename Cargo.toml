[package]
name = "hypergraft"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Bounded HTML-over-HTTP protocol with an Axum and Askama host"
readme = "README.md"
repository = "https://github.com/jazoom/hypergraft"
homepage = "https://github.com/jazoom/hypergraft"
publish = false
include = [
  "/src/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/protocol-v1.json",
]

[workspace]

[dependencies]
askama = "0.16.0"
axum = "0.8.9"

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
