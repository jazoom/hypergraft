<header>{{ self.heading }}</header><main id="results">{% block results %}{% for row in self.rows key(row.id) %}<article id="row-{{ row.id }}">{% block row_contents(row = row) %}<strong>{{ row.label }}</strong><aside>{% block status(row = row) %}{% if row.active %}<em>Active</em>{% else %}<em>Inactive</em>{% endif %}{% endblock %}</aside>{% endblock %}</article>{% endfor %}{% endblock %}</main>
