[package]
name = "hypergraft-template-core"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jazoom/hypergraft"
description = "HTML template compiler for Hypergraft"
publish = false

[dependencies]
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
proc-macro2 = "1"
quote = "1"
rustc_lexer = "0.1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
